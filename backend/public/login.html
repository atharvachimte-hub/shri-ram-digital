<!DOCTYPE html>
<html lang="en">
<head>
  <script>
    (function() {
      // Reset all sessions and cookies on login landing
      localStorage.removeItem("user");
      localStorage.removeItem("mlmAdminLoggedIn");
      localStorage.removeItem("mlmAdminPassword");
      document.cookie = "userAuth=; Path=/; Max-Age=0;";
      document.cookie = "adminAuth=; Path=/; Max-Age=0;";
    })();
  </script>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Login - Shriram Digital</title>

<link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;600&display=swap" rel="stylesheet">

<style>

*{
margin:0;
padding:0;
box-sizing:border-box;
font-family:'Poppins',sans-serif;
}

body{
height:100vh;
background:linear-gradient(rgba(0,0,0,0.6), rgba(0,0,0,0.6)),
url('https://images.unsplash.com/photo-1521791136064-7986c2920216');
background-size:cover;
background-position:center;
display:flex;
justify-content:center;
align-items:center;
}

.container{
width:100%;
max-width:400px;
background:rgba(255,255,255,0.08);
backdrop-filter:blur(10px);
padding:40px;
border-radius:12px;
color:white;
text-align:center;
}

.logo{
margin-bottom:20px;
font-size:22px;
font-weight:600;
}

h1{
margin-bottom:25px;
font-weight:600;
}

.input-box{
width:100%;
margin-bottom:15px;
}

.input-box input{
width:100%;
padding:14px;
border:none;
border-radius:8px;
outline:none;
font-size:14px;
}

.btn{
width:100%;
padding:14px;
border:none;
border-radius:8px;
background:#22c55e;
color:white;
font-size:16px;
font-weight:600;
cursor:pointer;
margin-top:10px;
}

.btn:hover{
background:#16a34a;
}

.extra{
margin-top:15px;
font-size:14px;
}

.extra a{
color:#22c55e;
text-decoration:none;
}

.footer{
margin-top:20px;
font-size:12px;
opacity:0.7;
}

</style>
</head>

<body>

<div class="container">

<div class="logo">
Shriram Digital
</div>

<!-- Login Card -->
<div id="loginCard">
  <h1>Login Account</h1>

  <div class="input-box">
    <input type="text" id="userId" placeholder="Enter User ID">
  </div>

  <div class="input-box">
    <input type="password" id="password" placeholder="Enter Password">
  </div>

  <button class="btn" onclick="login()">
    Login
  </button>

  <div class="extra">
    <a href="#" onclick="toggleCard('forgot')">Forgot Password?</a>
  </div>

  <div class="extra">
    Don’t have an account?
    <a href="register.html">Register</a>
  </div>
</div>

<!-- Forgot Password Card -->
<div id="forgotCard" style="display: none;">
  <h1>Reset Password</h1>

  <div class="input-box">
    <input type="text" id="forgotUserId" placeholder="Enter User ID">
  </div>

  <div class="input-box">
    <input type="text" id="forgotContact" placeholder="Registered Email or Mobile">
  </div>

  <div class="input-box">
    <input type="password" id="forgotNewPassword" placeholder="New Password">
  </div>

  <button class="btn" onclick="resetPassword()">
    Reset Password
  </button>

  <div class="extra">
    <a href="#" onclick="toggleCard('login')">Back to Login</a>
  </div>
</div>

<div class="footer">
© 2026 Shriram Digital
</div>

</div>

<script>

async function login(){
  const userIdInput = document.getElementById("userId").value.trim();
  const passwordInput = document.getElementById("password").value;

  if (!userIdInput || !passwordInput) {
    alert("Please enter both User ID and Password.");
    return;
  }

  try {
    const response = await fetch("/login", {
      method: "POST",
      headers: {
        "Content-Type": "application/json"
      },
      body: JSON.stringify({ userId: userIdInput, password: passwordInput })
    });

    const data = await response.json();

    if (data.success) {
      localStorage.setItem("user", JSON.stringify(data.user));
      window.location.href = "dashboard.html";
    } else {
      alert(data.message || "Invalid credentials.");
    }
  } catch (error) {
    console.error("Login error:", error);
    alert("Server error. Please try again later.");
  }
}

function toggleCard(card) {
  const loginCard = document.getElementById("loginCard");
  const forgotCard = document.getElementById("forgotCard");
  if (card === 'forgot') {
    loginCard.style.display = "none";
    forgotCard.style.display = "block";
  } else {
    loginCard.style.display = "block";
    forgotCard.style.display = "none";
  }
}

async function resetPassword() {
  const userId = document.getElementById("forgotUserId").value.trim();
  const contactInfo = document.getElementById("forgotContact").value.trim();
  const newPassword = document.getElementById("forgotNewPassword").value;

  if (!userId || !contactInfo || !newPassword) {
    alert("All fields are required.");
    return;
  }

  try {
    const response = await fetch("/api/auth/forgot-password", {
      method: "POST",
      headers: {
        "Content-Type": "application/json"
      },
      body: JSON.stringify({ userId, contactInfo, newPassword })
    });

    const data = await response.json();
    if (data.success) {
      alert(data.message || "Password reset successful!");
      toggleCard('login');
      document.getElementById("forgotUserId").value = "";
      document.getElementById("forgotContact").value = "";
      document.getElementById("forgotNewPassword").value = "";
    } else {
      alert(data.message || "Password reset failed.");
    }
  } catch (error) {
    console.error("Reset password error:", error);
    alert("Server error. Please try again later.");
  }
}

</script>

</body>
</html>
