<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Admin Withdraw Panel</title>

<style>
body {
    font-family: Arial;
    background: #0f172a;
    color: white;
    padding: 20px;
}

h1 {
    text-align: center;
    margin-bottom: 20px;
}

table {
    width: 100%;
    border-collapse: collapse;
    background: rgba(255,255,255,0.05);
    border-radius: 10px;
    overflow: hidden;
}

th, td {
    padding: 12px;
    text-align: center;
}

th {
    background: #1e293b;
}

tr:nth-child(even) {
    background: rgba(255,255,255,0.03);
}

button {
    padding: 6px 12px;
    border: none;
    border-radius: 6px;
    cursor: pointer;
}

.approve {
    background: #22c55e;
    color: white;
}

.reject {
    background: #ef4444;
    color: white;
}

.pending {
    color: yellow;
}

.approved {
    color: lightgreen;
}

.rejected {
    color: red;
}
</style>

</head>

<body>

<h1>Withdraw Requests</h1>

<div style="margin-bottom: 20px; display: flex; gap: 10px; align-items: center; justify-content: flex-end;">
  <label for="statusFilter" style="font-size: 14px; font-weight: bold;">Filter by Status:</label>
  <select id="statusFilter" onchange="loadWithdraws()" style="padding: 8px 12px; border-radius: 6px; background: #1e293b; color: white; border: 1px solid rgba(255,255,255,0.1); outline: none;">
    <option value="all">All Requests</option>
    <option value="pending" selected>Pending</option>
    <option value="approved">Approved</option>
    <option value="rejected">Rejected</option>
  </select>
</div>

<table id="withdrawTable">
<thead>
<tr>
    <th>User ID</th>
    <th>Amount</th>
    <th>Method</th>
    <th>Details</th>
    <th>Status & Remarks</th>
    <th>Action</th>
</tr>
</thead>

<tbody>
</tbody>
</table>

<script>

// Fetch Withdraw Requests
async function loadWithdraws() {
    try {
        const res = await fetch("/api/admin/withdraw-requests");
        const result = await res.json();
        
        if (!result.success) return;

        const filterValue = document.getElementById("statusFilter").value;
        const tbody = document.querySelector("#withdrawTable tbody");
        tbody.innerHTML = "";

        result.requests.forEach(w => {
            if (filterValue !== "all" && w.status !== filterValue) return;

            const tr = document.createElement("tr");

            let detailsHtml = "";
            if (w.paymentMethod === "BANK") {
                detailsHtml = `<strong>Holder:</strong> ${w.accountHolderName || "-"}<br><strong>Bank:</strong> ${w.bankName || "-"}<br><strong>A/C:</strong> ${w.accountNumber || "-"}<br><strong>IFSC:</strong> ${w.ifscCode || "-"}`;
            } else {
                detailsHtml = `<strong>UPI:</strong> ${w.upiId || "-"}`;
            }

            const remarkHtml = w.adminRemark ? `<div style="font-size: 11px; color: #ffb1b1; margin-top: 4px;"><strong>Remark:</strong> ${w.adminRemark}</div>` : "";
            const dateStr = w.requestDate ? new Date(w.requestDate).toLocaleString() : "-";
            const processedStr = w.processedDate ? `<div style="font-size: 11px; color: #a9c4de; margin-top: 4px;"><strong>Done:</strong> ${new Date(w.processedDate).toLocaleDateString()}</div>` : "";

            tr.innerHTML = `
                <td>${w.userId}</td>
                <td>₹${w.amount}</td>
                <td>${w.paymentMethod}</td>
                <td style="text-align: left; font-size: 13px;">${detailsHtml}</td>
                <td class="${w.status}">${w.status.toUpperCase()}${remarkHtml}${processedStr}</td>
                <td>
                    ${w.status === "pending" ? `
                        <button class="approve" onclick="processAction('${w.userId}', ${w.index}, 'approve')">Approve</button>
                        <button class="reject" onclick="processAction('${w.userId}', ${w.index}, 'reject')">Reject</button>
                    ` : `<span style="font-size: 13px; color: #94a3b8;">Processed</span>`}
                </td>
            `;

            tbody.appendChild(tr);
        });
    } catch (err) {
        console.error("Failed to load withdraws:", err);
    }
}

// Action processor
async function processAction(userId, index, action) {
    const adminRemark = prompt(`Enter optional admin remark/note for this ${action}:`);
    if (adminRemark === null) return; // cancelled

    try {
        const response = await fetch("/api/admin/withdraw-action", {
            method: "PATCH",
            headers: {
                "Content-Type": "application/json"
            },
            body: JSON.stringify({
                userId,
                index,
                action,
                adminRemark: adminRemark.trim()
            })
        });

        const data = await response.json();
        if (data.success) {
            alert(`Request successfully ${action}ed!`);
            loadWithdraws();
        } else {
            alert(data.message || "Failed to process request");
        }
    } catch (err) {
        console.error(err);
        alert("Server error processing request");
    }
}

// Auto refresh every 5 seconds
setInterval(loadWithdraws, 5000);

// Initial load
loadWithdraws();

</script>

</body>
</html>
